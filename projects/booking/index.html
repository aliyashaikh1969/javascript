<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>seat booking</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="seats box">
        <h2>Seat Booking</h2>
        <div class="seat-map"></div>
      </div>
      <div class="form box">
        <div class="preview">
          <h3>Booking Preview</h3>
          <div class="preview-seats"></div>
        </div>
        <form>
          <input type="number" class="input" placeholder="enter" min="1"/>
          <button type="submit">Book Seats</button>
        </form>

        <div class="buttons">
          <button class="confirm">Confirm Booking</button>
          <button class="reset">Reset</button>
        </div>
      </div>
    </div>
    <script type="module" src="app.js"></script>
  </body>
</html>
