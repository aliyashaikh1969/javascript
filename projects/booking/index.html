<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>seat booking</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="toast-container"></div>

    <div class="container">
      <div class="seats box">
        <h2>Seat Booking</h2>
        <p class="available-count"></p>

        <div class="legend">
          <span class="legend-item"><span class="dot available"></span>Available</span>
          <span class="legend-item"><span class="dot selected"></span>Selected</span>
          <span class="legend-item"><span class="dot booked"></span>Booked</span>
        </div>

        <p class="price-legend">Premium $20 (Rows 1-3) &middot; Standard $12 (Rows 4-7) &middot; Economy $8 (Rows 8-10)</p>

        <div class="search-box">
          <input type="number" class="search-input" placeholder="Find seat number" min="1" />
          <button class="search-btn" type="button">Find</button>
        </div>

        <div class="screen">Screen this way</div>
        <div class="seat-map"></div>
      </div>
      <div class="form box">
        <div class="preview">
          <h3>Booking Preview</h3>
          <div class="preview-summary"></div>
          <div class="preview-seats"></div>
        </div>
        <form>
          <input type="number" class="input" placeholder="Number of seats" min="1" step="1"/>
          <button type="submit">Book Seats</button>
        </form>

        <input type="text" class="passenger-name" placeholder="Passenger name (required to confirm)" />

        <div class="buttons">
          <button class="confirm">Confirm Booking</button>
          <button class="clear">Clear All</button>
          <button class="reset">Reset</button>
        </div>

        <div class="receipt" hidden></div>
      </div>
    </div>

    <div class="history box">
      <h3>Booking History</h3>
      <div class="booking-history-list"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
